<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安全技术错题本</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-editor">
          <p class="source">Apple Notes · 26技术</p>
          <input id="titleInput" class="title-input" type="text" value="安全技术错题本" aria-label="错题本标题" />
          <div class="title-actions">
            <button id="saveTitleBtn" type="button">保存标题</button>
            <button id="syncDataBtn" type="button">云同步全部</button>
            <button id="loadCloudBtn" type="button">读取云端</button>
            <span id="titleSyncStatus">读取云端学习数据</span>
          </div>
        </div>
        <div class="honor">
          <strong>错题攻克中</strong>
          <span>稳步提升</span>
        </div>
        <div class="sync">
          <span class="sync-dot"></span>
          <span id="updatedAt">读取中</span>
        </div>
      </header>

      <main>
        <section class="mode-switch" aria-label="学习模式">
          <button class="active" type="button" data-mode="review">背诵复习</button>
          <button type="button" data-mode="quiz">测试模式</button>
        </section>

        <section class="summary" aria-label="学习概览">
          <article>
            <span id="totalCount">0</span>
            <p>错题</p>
          </article>
          <article>
            <span id="sectionCount">0</span>
            <p>章节</p>
          </article>
          <article>
            <span id="masteredCount">0</span>
            <p>已掌握</p>
          </article>
          <article>
            <span id="quizScore">0%</span>
            <p>测试正确率</p>
          </article>
        </section>

        <section id="analysisPanel" class="analysis-panel collapsed" aria-label="错题分析">
          <button id="analysisToggle" class="analysis-toggle" type="button" aria-expanded="false">
            <span>
              <small>错题分析</small>
              <strong>薄弱章节雷达</strong>
            </span>
            <em id="analysisSignal">等待学习记录</em>
          </button>
          <div id="analysisBody" class="analysis-body" hidden>
            <p class="analysis-rule">
              背诵复习按备忘录错题量、未掌握数、复习次数评判；测试模式按每章答错率、答错次数和答题覆盖率评判。
            </p>
            <div class="analysis-grid">
              <article class="chart-card">
                <div class="chart-title">
                  <strong>背诵复习薄弱度</strong>
                  <span>备忘录错题量 / 未掌握 / 复习覆盖</span>
                </div>
                <div id="reviewBarChart" class="bar-chart"></div>
              </article>
              <article class="chart-card">
                <div class="chart-title">
                  <strong>测试结果薄弱度</strong>
                  <span>答错率 / 错题数 / 覆盖率</span>
                </div>
                <div id="quizBarChart" class="bar-chart"></div>
              </article>
              <article class="chart-card">
                <div class="chart-title">
                  <strong>背诵掌握结构</strong>
                  <span>已掌握 / 待巩固 / 需攻克</span>
                </div>
                <div class="pie-wrap">
                  <div id="pieChart" class="pie-chart"></div>
                  <div id="pieLegend" class="pie-legend"></div>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="controls" aria-label="筛选">
          <label class="search">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="输入关键词、数值、设备名" />
          </label>
          <div class="segments" role="tablist" aria-label="题型">
            <button class="active" data-kind="all">全部</button>
            <button data-kind="数值题">数值题</button>
            <button data-kind="概念题">概念题</button>
          </div>
        </section>

        <nav id="sectionTabs" class="section-tabs" aria-label="章节"></nav>

        <section class="content">
          <div class="section-head">
            <div>
              <p id="domainName">机械</p>
              <h2 id="sectionName">机械基础</h2>
            </div>
            <button id="shuffleBtn" type="button">随机背诵</button>
          </div>
          <div id="quizPager" class="quiz-pager" data-quiz-pager hidden></div>
          <div class="sync-note">
            题库从 <code>data.json</code> 读取；标题、自定义命题、背诵记录和测试记录可通过顶部按钮同步到 <code>user-data.json</code>。
          </div>
          <div id="cards" class="cards"></div>
          <div id="quizPagerBottom" class="quiz-pager quiz-pager-bottom" data-quiz-pager hidden></div>
        </section>
      </main>
    </div>

    <template id="cardTemplate">
      <article class="mistake-card">
        <div class="card-meta">
          <strong></strong>
          <span></span>
        </div>
        <p class="question"></p>
        <div class="memory"></div>
        <div class="actions">
          <button class="review-btn" type="button">复习 +1</button>
          <button class="master-btn" type="button">标记掌握</button>
        </div>
      </article>
    </template>

    <template id="quizTemplate">
      <article class="quiz-card">
        <div class="card-meta">
          <strong></strong>
          <span></span>
        </div>
        <p class="quiz-prompt"></p>
        <p class="quiz-hint"></p>
        <button class="reveal-btn" type="button">显示答案</button>
        <div class="quiz-answer" hidden></div>
        <div class="quiz-actions" hidden>
          <button class="wrong-btn" type="button">答错</button>
          <button class="right-btn" type="button">答对</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
